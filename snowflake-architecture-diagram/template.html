// Create SVG element with attributes
function el(t,a,p){const e=document.createElementNS(NS,t);for(const[k,v]of Object.entries(a||{}))e.setAttribute(k,String(v));if(p)p.appendChild(e);return e;}

// Text element: T(x, y, string, fontSize, color, {b: bold, a: anchor})
function T(x,y,s,sz,c,o){o=o||{};const t=el('text',{x,y,'font-family':'Segoe UI,system-ui,sans-serif','font-size':sz,fill:c,'font-weight':o.b?'700':'400','text-anchor':o.a||'start'},S);t.textContent=s;return t;}

// Rectangle: R(x, y, width, height, fill, stroke, strokeWidth)
function R(x,y,w,h,f,s,sw){return el('rect',{x,y,width:w,height:h,rx:5,fill:f||'#fff',stroke:s||'#ccc','stroke-width':sw||1.5},S);}

// Arrow marker
function mA(c){const id='a'+c.replace('#','');if(!document.getElementById(id)){const m=el('marker',{id,markerWidth:8,markerHeight:6,refX:7,refY:3,orient:'auto'},D);el('path',{d:'M0,0 L8,3 L0,6 Z',fill:c},m);}return id;}

// Dashed path

// Arrow line

// Box with label: B(x, y, width, height, label, borderColor, bgColor)
